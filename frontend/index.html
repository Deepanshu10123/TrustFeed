<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@400;600;700&display=swap" />
    <title>TrustFeed</title>
    <meta name="description" content="A short-video feed where every post is fact-checked against real sources before anyone else sees it. Share a clip and see the evidence behind each verdict." />
    <meta name="theme-color" content="#0b0c0e" />

    <!-- The card that shows when the link is pasted into WhatsApp, iMessage, X
         and the like. Those crawlers don't run the app, so it's the same card
         for every link to the site; the image has to be a full web address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TrustFeed" />
    <meta property="og:title" content="TrustFeed: the feed that shows its work" />
    <meta property="og:description" content="A short-video feed where every post is fact-checked against real sources before anyone else sees it. Share a clip and see the evidence behind each verdict." />
    <meta property="og:url" content="https://trust-feed-livid.vercel.app/" />
    <meta property="og:image" content="https://trust-feed-livid.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TrustFeed: the feed that shows its work" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TrustFeed: the feed that shows its work" />
    <meta name="twitter:description" content="A short-video feed where every post is fact-checked against real sources before anyone else sees it. Share a clip and see the evidence behind each verdict." />
    <meta name="twitter:image" content="https://trust-feed-livid.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root">
      <!-- Shown while the app's code downloads; React replaces it the moment it
           starts. Same markup as the Loader component (src/screens/Loader.tsx). -->
      <div class="splash" data-static role="status" aria-label="Loading TrustFeed">
        <div class="loader">
          <svg class="loader-mark" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle class="loader-ring" cx="32" cy="32" r="27" pathLength="1"></circle>
            <path class="loader-check" d="M20 33.5l8.5 8.5L44 24" pathLength="1"></path>
          </svg>
          <div class="loader-word">TrustFeed</div>
        </div>
      </div>
    </div>
    <script>
      // If the app hasn't taken over from the loading screen above after a while (a slow
      // or dropped connection while its code downloads), say so and offer a reload,
      // instead of animating for ever.
      setTimeout(function () {
        var loader = document.querySelector('#root > .splash[data-static] .loader')
        if (!loader) return
        var note = document.createElement('p')
        note.className = 'loader-note'
        note.textContent = 'This is taking longer than usual. Your connection may be slow.'
        var button = document.createElement('button')
        button.className = 'loader-btn'
        button.type = 'button'
        button.textContent = 'Reload'
        button.onclick = function () { location.reload() }
        loader.appendChild(note)
        loader.appendChild(button)
      }, 12000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
