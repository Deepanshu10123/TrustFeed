name: Keep API awake

# Render's free web services go to sleep after 15 minutes without a request,
# and the first visitor after that waits about a minute for the API to wake
# up. This visits /health every 5 minutes so that mostly doesn't happen.
#
# It's a nudge, not a guarantee: GitHub is allowed to run scheduled jobs late,
# and switches them off in a public repo after 60 days without any commits.
# In practice it's far too unreliable to depend on -- measured over 11 hours it
# ran 6 times instead of about 137, so the API slept between nearly every run.
# The reliable keep-awake is now the Verification Service itself, which never
# sleeps and visits /health every 4 minutes (backend/app/core/keep_awake.py);
# this job is just a second, weaker nudge on top.
# A failed visit only leaves a warning on the run (rather than failing it), so
# an outage doesn't send you an email every 5 minutes.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the API
        run: |
          curl --fail --silent --show-error --max-time 100 --retry 2 --retry-delay 15 \
            https://trustfeed-api.onrender.com/health \
            || echo "::warning::The API didn't answer -- it may be down or still waking up"
