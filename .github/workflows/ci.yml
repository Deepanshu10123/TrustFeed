name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend tests (fast, no secrets needed)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Only the pure-function tests run here (the publish gate, stuck
      # posts, daily upload limits, usernames, error-report scrubbing, sign-in checks, cached interests, the keep-awake nudge, making
      # uploaded videos quick to play (converts tiny generated videos with the real ffmpeg), and the Supabase connection
      # settings (HTTP/1.1, no shared HTTP/2), and the live feed updates (with a fake database) -- see docs/milestones/milestone-8c-ci.md for exactly
      # what's excluded and why (LLM-calling tests are slow/costly; the
      # Redis-backed queue test depends on a live external service).
      - run: pytest tests/test_gate.py tests/test_stuck_posts.py tests/test_upload_limits.py tests/test_usernames.py tests/test_monitoring.py tests/test_auth.py tests/test_interests_cache.py tests/test_keep_awake.py tests/test_video_optimize.py tests/test_worker_video.py tests/test_supabase_client.py tests/test_feed_updates.py -v

  frontend-build:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
