<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@400;600;700&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Public Sans', system-ui, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { opacity: 0.8; }

  :root {
    --bg: oklch(9% 0.004 260);
    --surface: oklch(15% 0.006 260);
    --border: oklch(24% 0.008 260);
    --text: oklch(97% 0.002 260);
    --text-secondary: oklch(70% 0.006 260);
    --accent: oklch(72% 0.1 262);
    --chip-bg: oklch(20% 0.008 260);
    --btn-bg: oklch(97% 0.002 260);
    --btn-fg: oklch(9% 0.004 260);
  }

  .phone {
    width: 390px; height: 844px;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .auth-wrap {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
    padding: 32px 28px;
    gap: 28px;
  }
  .eyebrow {
    font: 600 11px/1 'Public Sans', sans-serif;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--text-secondary);
    text-align: center;
  }
  .wordmark {
    font: 600 30px/1.1 'Source Serif 4', serif;
    text-align: center;
    margin-top: 6px;
  }
  .tagline {
    font: 400 14.5px/1.4 'Public Sans', sans-serif;
    color: var(--text-secondary);
    text-align: center;
    margin-top: 8px;
  }
  .segmented {
    display: flex; background: var(--chip-bg);
    border-radius: 999px; padding: 4px; gap: 4px;
  }
  .segmented button {
    flex: 1; border: none; background: transparent;
    padding: 11px 0; border-radius: 999px;
    font: 600 14px/1 'Public Sans', sans-serif;
    color: var(--text-secondary); cursor: pointer;
    min-height: 44px;
  }
  .segmented button.active {
    background: var(--surface); color: var(--text);
  }
  .form-title {
    font: 600 22px/1.2 'Source Serif 4', serif;
    margin: 4px 0 4px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label {
    font: 500 13px/1.2 'Public Sans', sans-serif;
    color: var(--text-secondary);
  }
  .field-input {
    width: 100%; padding: 13px 14px;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    font: 400 15px/1.3 'Public Sans', sans-serif;
  }
  .field-input::placeholder { color: var(--text-secondary); opacity: 0.7; }
  .field-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn-primary {
    width: 100%; padding: 14px; margin-top: 6px;
    border-radius: 10px; border: none;
    background: var(--btn-bg); color: var(--btn-fg);
    font: 600 15px/1 'Public Sans', sans-serif; cursor: pointer;
    min-height: 48px;
  }
  .fineprint {
    font: 400 12.5px/1.5 'Public Sans', sans-serif;
    color: var(--text-secondary);
    text-align: center;
  }
</style>
</helmet>

<div class="phone" style="--accent:{{accent}}">
  <div class="auth-wrap">
    <div>
      <div class="eyebrow">Verified Feed</div>
      <div class="wordmark">TrustFeed</div>
      <div class="tagline">The feed that shows its work.</div>
    </div>

    <div class="segmented">
      <button class="{{loginBtnClass}}" onClick="{{setLogin}}">Log in</button>
      <button class="{{signupBtnClass}}" onClick="{{setSignup}}">Sign up</button>
    </div>

    <div>
      <div class="form-title">{{title}}</div>
      <div style="display:flex; flex-direction:column; gap:14px; margin-top:14px;">
        <div class="field">
          <label class="field-label">Email</label>
          <input class="field-input" type="email" placeholder="you@example.com" />
        </div>
        <div class="field">
          <label class="field-label">Password</label>
          <input class="field-input" type="password" placeholder="••••••••" />
        </div>
        <button class="btn-primary">{{cta}}</button>
      </div>
    </div>

    <div class="fineprint">By continuing you agree this feed checks what it shows you before it shows it.</div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"oklch(72% 0.1 262)"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'login' };
  }
  renderVals() {
    const mode = this.state.mode;
    return {
      accent: this.props.accent ?? 'oklch(72% 0.1 262)',
      loginBtnClass: mode === 'login' ? 'active' : '',
      signupBtnClass: mode === 'signup' ? 'active' : '',
      title: mode === 'login' ? 'Welcome back' : 'Create your account',
      cta: mode === 'login' ? 'Log in' : 'Create account',
      setLogin: () => this.setState({ mode: 'login' }),
      setSignup: () => this.setState({ mode: 'signup' }),
    };
  }
}
</script>
</body>
</html>
